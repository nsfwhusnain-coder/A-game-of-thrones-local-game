# Every push and pull request: the data checks and the engine/HTTP tests, on Windows (where the owner plays) and Linux.
# No model and no GPU are needed: the tests run the real server on the mock provider.
name: CI
on:
  push:
    branches-ignore: ['wp/**'] # a work branch is tested once, as its pull request (the push and the pull request were two identical runs of an hour of two machines)
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
