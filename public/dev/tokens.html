<!doctype html>
<html><head><meta charset="utf-8"><title>tokens</title>
<link rel="stylesheet" href="../css/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #0c1016; overflow: hidden; }
  #map-wrap { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; top: 10px; z-index: 50; color: #e8dcc0; font: 14px/1.3 sans-serif; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px; }
</style></head>
<body>
<div id="map-wrap"></div><div id="hud">loading…</div>
<script type="module">
// Every kind of party token on one stretch of the North (docs/gdd/11-map-visuals.md §6.1, §12; WP E5):
// your host, a seen enemy host, a host known only by report, a fleet, the King's progress, a lord's retinue, outlaws,
// and three hosts on one spot (a stack). ?lod=0|1|2|3 (default 1) · &fan=1 (fan the stack out) · &dist=N
import { createInitialState } from '../js/shared/world.js';
import { MapScene, LOD, lodOf } from '../js/map3d/MapScene.js';
const q = new URLSearchParams(location.search);
const lod = Math.max(0, Math.min(3, Number(q.get('lod') ?? 1)));
const s = createInitialState('agot_298', 'stark', { seed: 1 });
const P = (id, owner, kind, pos, men, extra = {}) => { s.parties[id] = { id, owner, kind, name: extra.name || id, pos, men, composition: 'Levies and knights', morale: 70, supply: 80, members: [], at: null, ...extra }; };
const WF = s.holdings.stark.pos;
P('my_host', 'stark', 'host', [WF[0] + 40, WF[1] + 60], 4200, { name: 'The Host of Winterfell', commander: 'robb_stark' });
P('bolton_host', 'bolton', 'host', [WF[0] + 150, WF[1] + 30], 3000, { name: 'The Dreadfort host', commander: 'roose_bolton' });
P('stack_a', 'karstark', 'host', [WF[0] - 60, WF[1] + 150], 2800, { name: 'Karhold\'s levy', commander: 'rickard_karstark' });
P('stack_b', 'umber', 'host', [WF[0] - 58, WF[1] + 152], 3100, { name: 'The Umbers', commander: 'jon_umber' });
P('stack_c', 'glover', 'host', [WF[0] - 61, WF[1] + 149], 1500, { name: 'Deepwood men', commander: 'robett_glover' });
P('manderly_fleet', 'manderly', 'fleet', [WF[0] + 210, WF[1] + 220], 900, { name: 'The White Harbor fleet', ships: 24 });
P('retinue_x', 'hornwood', 'retinue', [WF[0] + 100, WF[1] + 110], 30, { name: 'Lady Hornwood\'s party', commander: 'donella_hornwood', public: true, march: { to: 'stark' }, purpose: { dest: 'stark', home: 'hornwood' } });
P('outlaws', 'stark', 'band', [WF[0] - 120, WF[1] + 40], 60, { name: 'Wolfswood outlaws' });
s.parties.outlaws.owner = 'bolton';
// the King's progress, riding north on the kingsroad
const kp = s.parties.royal_progress || (P('royal_progress', 'baratheon', 'progress', [0, 0], 380, { name: 'The King\'s progress', commander: 'robert_baratheon' }), s.parties.royal_progress);
Object.assign(kp, { kind: 'progress', public: true, pos: [WF[0] + 10, WF[1] + 230], at: null, march: { to: 'stark' } });
// a Lannister host known only by an old raven (not seen): its plate is grey and says how old the word is
P('lannister_rumour', 'lannister', 'host', [WF[0] + 20, WF[1] + 700], 8000, { name: 'A western host', commander: 'jaime_lannister' });
s.knowledge = s.knowledge || {}; s.knowledge.stark = s.knowledge.stark || {}; s.knowledge.stark.parties = { ...(s.knowledge.stark.parties || {}), lannister_rumour: { turn: s.meta.turn - 1, pos: [WF[0] + 20, WF[1] + 300], men: 6000, source: 'a trader\'s word', owner: 'lannister' } };
const map = new MapScene(document.getElementById('map-wrap'), {});
window.__map = map;
await map.generate(s.holdings, (p, msg) => { document.getElementById('hud').textContent = `${msg}… ${Math.round(p * 100)} %`; });
map.setState(s);
map.tween = null; map.dist = Number(q.get('dist')) || LOD[lod]; map.target.set(WF[0] + 40, 0, WF[1] + (lod === 0 ? 400 : 140)); map.updateCamera();
if (q.get('fan')) map.fan = { key: ['stack_a', 'stack_b', 'stack_c'].sort().join('|'), x: 0, y: 0 }, map.mouseXY = [0, 0];
let frames = 0;
const tick = () => { if (++frames > 10) { const plates = [...document.querySelectorAll('.lbl.army')].filter((e) => e.style.display !== 'none').map((e) => e.textContent || e.title); window.__plates = plates; document.getElementById('hud').textContent = `tokens · L${lod} (lod ${lodOf(map.dist).toFixed(2)}) · ${plates.length} plates`; document.title = 'ready'; } else requestAnimationFrame(tick); };
requestAnimationFrame(tick);
</script>
</body></html>
