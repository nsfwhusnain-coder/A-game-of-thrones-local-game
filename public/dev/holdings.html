<!doctype html>
<html><head><meta charset="utf-8"><title>holdings' states</title>
<link rel="stylesheet" href="../css/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #0c1016; overflow: hidden; }
  #map-wrap { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; top: 10px; z-index: 50; color: #e8dcc0; font: 14px/1.3 sans-serif; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px; white-space: pre; }
</style></head>
<body>
<div id="map-wrap"></div><div id="hud">loading…</div>
<script type="module">
// The nine holdings of the North nearest Winterfell, each in one state (docs/gdd/11-map-visuals.md §6.4; WP E6): normal, burning, sacked, besieged (with the host camped before its walls),
// rising, occupied, a ruin, a tourney and a feast held there; and a field fought between them, with a camp on the road. `?preset=fast|balanced|high` · `&weather=snow|rain|none` · `&lod=2|3` · `&dist=N` · `&focus=0…8`.
// The page reports `window.__fx` (what was drawn, from Effects.stats()) so the budget can be checked by a script.
import { createInitialState } from '../js/shared/world.js';
import { MapScene, LOD } from '../js/map3d/MapScene.js';
const q = new URLSearchParams(location.search);
const preset = q.get('preset') || 'balanced'; try { localStorage.setItem('gfx-quality', preset); localStorage.setItem('map-life', '0'); } catch { /* */ }
const lod = Math.max(0, Math.min(3, Number(q.get('lod') ?? 2)));
const s = createInitialState('agot_298', 'stark', { seed: 1 });
const WF = s.holdings.stark.pos;
const near = Object.values(s.holdings).filter((h) => h.region === 'north' && h.type !== 'camp').sort((a, b) => Math.hypot(a.pos[0] - WF[0], a.pos[1] - WF[1]) - Math.hypot(b.pos[0] - WF[0], b.pos[1] - WF[1])).slice(0, 9);
const states = ['normal', 'burning', 'sacked', 'besieged', 'rising', 'occupied', 'ruin', 'normal', 'normal'];
near.forEach((h, i) => { h.status = states[i]; });
const [, , , besieged, , , , tourneyAt, feastAt] = near;
s.history = [{ turn: 0, events: [{ kind: 'tourney', where: tourneyAt.id, headline: 'A tourney is held', tier: 'major' }, { kind: 'feast', where: feastAt.id, headline: 'A feast is held', tier: 'news' }] }];
s.battles = [{ turn: 0, pos: [WF[0] + 40, WF[1] + 120], name: 'The Field of Crows', attacker: 'stark', defender: 'bolton', victor: 'stark', summary: 'A field fought.' }];
const P = (id, owner, kind, pos, men, extra = {}) => { s.parties[id] = { id, owner, kind, name: extra.name || id, pos, men, composition: 'Levies and knights', morale: 70, supply: 80, members: [], at: null, march: null, route: null, state: 'camped', ...extra }; };
P('besiegers', 'bolton', 'host', [besieged.pos[0] + 8, besieged.pos[1] + 6], 2600, { name: 'The besiegers', state: 'besieging', besieging: besieged.id });
P('camp_road', 'stark', 'host', [WF[0] + 20, WF[1] + 70], 1800, { name: 'A camp on the road' });
const map = new MapScene(document.getElementById('map-wrap'), {});
window.__map = map;
await map.generate(s.holdings, (p, msg) => { document.getElementById('hud').textContent = `${msg}… ${Math.round(p * 100)} %`; });
map.setState(s);
const f = q.get('focus') !== null ? near[Number(q.get('focus'))] : null; // ?focus=0…8: the camera on one of the nine holdings
map.tween = null; map.dist = Number(q.get('dist')) || LOD[lod]; map.target.set(f ? f.pos[0] : WF[0] + 30, 0, f ? f.pos[1] : WF[1] + 60); map.updateCamera();
const w = q.get('weather'); const season = w === 'snow' ? 'winter' : w === 'rain' ? 'autumn' : 'summer';
s.world = { ...(s.world || {}), season };
if (w && w !== 'none' && map.effects) { map.effects.setWeather({ kind: w, density: 0.9 }); map.updateWeather = () => {}; }
let frames = 0;
const tick = () => { if (++frames > 30) { window.__fx = { ...map.effects.stats(), calls: map.renderer.info.render.calls, preset }; document.getElementById('hud').textContent = `preset ${preset} · lod ${lod} · ${JSON.stringify(window.__fx)}`; } requestAnimationFrame(tick); };
requestAnimationFrame(tick);
</script>
</body></html>
