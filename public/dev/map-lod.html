<!doctype html>
<html><head><meta charset="utf-8"><title>map-lod</title>
<link rel="stylesheet" href="../css/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #0c1016; overflow: hidden; }
  #map-wrap { position: absolute; inset: 0; }
  body.boxes .lbl { outline: 1px dashed rgba(255, 80, 80, 0.8); }
  #hud { position: absolute; left: 12px; top: 10px; z-index: 50; color: #e8dcc0; font: 14px/1.3 sans-serif; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px; }
</style></head>
<body>
<div id="map-wrap"></div><div id="hud">loading…</div>
<script type="module">
// The map at its four levels of detail over five fixed spots (docs/gdd/11-map-visuals.md §12; WP E1):
//   ?spot=realm|kings_landing|winterfell|twins|pyke|sunspear  &lod=0|1|2|3  &boxes=1 (outline every label's box)
//   &season=summer|autumn|winter|spring &days=N (how old the season is: the snow line, WP E3)  &dist=N (a camera distance)
// The page sets document.title to "ready" once the map has drawn the view, for the screenshot tests.
import { createInitialState } from '../js/shared/world.js';
import { MapScene, LOD, lodOf } from '../js/map3d/MapScene.js';
const q = new URLSearchParams(location.search);
const SPOTS = { realm: 'realm', kings_landing: 'baratheon', winterfell: 'stark', twins: 'frey', pyke: 'greyjoy', sunspear: 'martell' };
const spot = q.get('spot') || 'realm'; const lod = Math.max(0, Math.min(3, Number(q.get('lod') ?? 0)));
if (q.get('boxes')) document.body.classList.add('boxes');
const state = createInitialState('agot_298', 'stark', { seed: 1 });
if (q.get('season')) state.world = { ...state.world, season: q.get('season'), seasonDays: Number(q.get('days') || 0) };
const map = new MapScene(document.getElementById('map-wrap'), {});
window.__map = map;
await map.generate(state.holdings, (p, msg) => { document.getElementById('hud').textContent = `${msg}… ${Math.round(p * 100)} %`; });
map.setState(state);
const hid = SPOTS[spot];
const pos = spot === 'realm' ? null : state.holdings[hid]?.pos;
if (pos) { map.target.set(pos[0], 0, pos[1]); } else map.home();
map.tween = null; map.dist = Number(q.get('dist')) || LOD[lod]; if (!pos) { map.target.set(720, 0, 1370); }
map.updateCamera();
let frames = 0;
// the labels on screen must never overlap (11 §8; WP E4): measured from what the browser drew, pins and rotated sea names aside
const overlaps = () => {
  const r = [...document.querySelectorAll('.lbl')].filter((e) => e.style.display !== 'none' && !/event|pulse/.test(e.className) && !/rotate/.test(e.style.transform)).map((e) => [e, e.getBoundingClientRect()]).filter(([, b]) => b.width && b.right > 0 && b.bottom > 0 && b.left < innerWidth && b.top < innerHeight);
  const bad = []; for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++) { const a = r[i][1], b = r[j][1]; const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left), oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top); if (ox > 1 && oy > 1) bad.push([r[i][0].textContent, r[j][0].textContent]); }
  return { shown: r.length, bad };
};
const tick = () => { if (++frames > 8) { const o = overlaps(); window.__overlaps = o; document.getElementById('hud').textContent = `${spot} · L${lod} (lod ${lodOf(map.dist).toFixed(2)}, distance ${Math.round(map.dist)}) · ${o.shown} labels, ${o.bad.length} overlapping`; document.title = 'ready'; } else requestAnimationFrame(tick); };
requestAnimationFrame(tick);
</script>
</body></html>
