<?xml version="1.0" encoding="UTF-8"?>
<!-- The maester's ornaments (GDD 21 §4). Hand-drawn; a sprite: each piece has a <view>, so CSS asks for one with
     background: url(ornaments.svg#corner-knot) …  Ink, rubric red and gold leaf only. One ornament per surface. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd47f"/><stop offset=".55" stop-color="#b98a2e"/><stop offset="1" stop-color="#8a6420"/></linearGradient>
    <linearGradient id="gl-h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d98a"/><stop offset=".5" stop-color="#bd8f32"/><stop offset="1" stop-color="#7e5a1c"/></linearGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f2519"/><stop offset="1" stop-color="#5f1611"/></linearGradient>
    <linearGradient id="fade-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1d12" stop-opacity="0"/><stop offset=".35" stop-color="#2a1d12" stop-opacity=".85"/><stop offset="1" stop-color="#2a1d12" stop-opacity=".9"/></linearGradient>
    <linearGradient id="fade-r" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2a1d12" stop-opacity="0"/><stop offset=".35" stop-color="#2a1d12" stop-opacity=".85"/><stop offset="1" stop-color="#2a1d12" stop-opacity=".9"/></linearGradient>
    <!-- a palmate weirwood leaf: one outline of five lobes, drawn pointing up from its stem -->
    <g id="wleaf">
      <path d="M0 2L3.8 1.4 11.3-2 6.6-3.6 10-11.2 2.9-7.5 0-18-2.9-7.5-10-11.2-6.6-3.6-11.3-2-3.8 1.4z" fill="url(#rub)" stroke="url(#rub)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0 1V-15M0 0L-8.4-8.6M0 0L8.4-8.6M0 0L-9.4-1.2M0 0L9.4-1.2" fill="none" stroke="#2f0a07" stroke-opacity=".5" stroke-width=".7" stroke-linecap="round"/>
      <path d="M0 2C.4 4.6 1.6 6 3.4 6.6" fill="none" stroke="#5f1611" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <!-- Solomon's knot: two interlocked loops; a band is ink outside, a thin gap of parchment inside -->
    <g id="knot" fill="none">
      <g id="knot-h"><ellipse cx="0" cy="0" rx="13" ry="7" fill="none" stroke="#2a1d12" stroke-width="3.2"/><ellipse cx="0" cy="0" rx="13" ry="7" fill="none" stroke="#e8dcc0" stroke-width="1.15"/></g>
      <g id="knot-v"><ellipse cx="0" cy="0" rx="7" ry="13" fill="none" stroke="#2a1d12" stroke-width="3.2"/><ellipse cx="0" cy="0" rx="7" ry="13" fill="none" stroke="#e8dcc0" stroke-width="1.15"/></g>
    </g>
    <clipPath id="c-a"><circle cx="-6.16" cy="-6.16" r="3.4"/></clipPath>
    <clipPath id="c-b"><circle cx="6.16" cy="6.16" r="3.4"/></clipPath>
    <clipPath id="c-c"><circle cx="6.16" cy="-6.16" r="3.4"/></clipPath>
    <clipPath id="c-d"><circle cx="-6.16" cy="6.16" r="3.4"/></clipPath>
  </defs>

  <!-- 1 · corner-knot (72×72, the corner at the top left; CSS flips it for the others) -->
  <g id="p-corner-knot" transform="translate(0 0)">
    <path d="M4 3.5H70M3.5 4V70" fill="none" stroke="#2a1d12" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8.6 8.6H70M8.6 8.6V70" fill="none" stroke="#2a1d12" stroke-width=".8" stroke-opacity=".8" stroke-linecap="round"/>
    <path d="M31 19H70M19 31V70" fill="none" stroke="#2a1d12" stroke-width="3" stroke-linecap="round"/>
    <path d="M31 19H70M19 31V70" fill="none" stroke="#e8dcc0" stroke-width="1.1" stroke-linecap="round"/>
    <g transform="translate(19 19)">
      <use href="#knot-v"/><use href="#knot-h"/>
      <use href="#knot-v" clip-path="url(#c-c)"/><use href="#knot-v" clip-path="url(#c-d)"/>
    </g>
    <circle cx="62" cy="19" r="1.7" fill="url(#gl)"/><circle cx="19" cy="62" r="1.7" fill="url(#gl)"/>
  </g>

  <!-- 2 · corner-leaf (72×72, at x 80): a red weirwood leaf on a thin L-rule, with a curl of vine -->
  <g id="p-corner-leaf" transform="translate(80 0)">
    <path d="M4 3.5H70M3.5 4V70" fill="none" stroke="#2a1d12" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8.6 8.6H70M8.6 8.6V70" fill="none" stroke="#2a1d12" stroke-width=".8" stroke-opacity=".8" stroke-linecap="round"/>
    <g transform="translate(13.5 13.5) rotate(135) scale(1.5)"><use href="#wleaf"/></g>
    <path d="M13.5 13.5L8.6 8.6" stroke="#2a1d12" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="57" cy="8.6" r="1.7" fill="url(#gl)"/><circle cx="8.6" cy="57" r="1.7" fill="url(#gl)"/>
  </g>

  <!-- 3 · fleuron-rule (320×24 at x 160, y 0): a tapering rule either side of a small red weirwood leaf -->
  <g id="p-fleuron-rule" transform="translate(160 0)">
    <path d="M6 12H140" stroke="url(#fade-l)" stroke-width="1.1" fill="none"/>
    <path d="M180 12H314" stroke="url(#fade-r)" stroke-width="1.1" fill="none"/>
    <path d="M8 14.6H118M202 14.6H312" stroke="#2a1d12" stroke-opacity=".28" stroke-width=".7" fill="none"/>
    <g fill="#2a1d12"><circle cx="147" cy="12" r="1.5"/><circle cx="173" cy="12" r="1.5"/><circle cx="141" cy="12" r=".9"/><circle cx="179" cy="12" r=".9"/></g>
    <g transform="translate(160 15.4) scale(.66)"><use href="#wleaf"/></g>
  </g>

  <!-- 4 · tier-diamond (16×16 at x 500, y 0): gold leaf with a burnished edge -->
  <g id="p-tier-diamond" transform="translate(500 0)">
    <path d="M8 .9L15.1 8 8 15.1.9 8z" fill="url(#gl-h)" stroke="#5e4012" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M8 2.3L13.2 8H8z" fill="#fff" fill-opacity=".3"/>
  </g>

  <!-- 5 · rubric-bullet (12×12 at x 524, y 0) -->
  <g id="p-rubric-bullet" transform="translate(524 0)">
    <path d="M6 .6L11.4 6 6 11.4.6 6z" fill="url(#rub)" stroke="#3a0c08" stroke-width=".6" stroke-linejoin="round"/>
    <circle cx="6" cy="6" r="1.1" fill="url(#gl)"/>
  </g>

  <!-- 6 · initial-frame (96×96 at x 0, y 90): a rubric square, gold-leaf rule, a vine growing in from the corner -->
  <g id="p-initial-frame" transform="translate(0 90)">
    <rect x="1" y="1" width="94" height="94" rx="2" fill="url(#rub)"/>
    <rect x="1" y="1" width="94" height="94" rx="2" fill="none" stroke="#2a0906" stroke-width="1.2"/>
    <rect x="4.5" y="4.5" width="87" height="87" rx="1" fill="none" stroke="url(#gl-h)" stroke-width="2.6"/>
    <rect x="9.2" y="9.2" width="77.6" height="77.6" fill="none" stroke="url(#gl)" stroke-width=".8" stroke-opacity=".85"/>
    <g fill="none" stroke="url(#gl)" stroke-width="1.5" stroke-linecap="round">
      <path d="M13 83C26 78 36 84 48 79S70 76 80 82"/>
      <path d="M83 13C78 26 84 36 79 48S76 70 82 80"/>
    </g>
    <g fill="url(#gl)">
      <path d="M25 80.6c1.6-5 6-6.4 9-4.4-.6 3.8-4.6 6-9 4.4z"/><path d="M45 79.4c.6-5.4 5-7.4 8.4-5.6-.2 4-4 6.6-8.4 5.6z"/><path d="M63 77.6c2-4.6 6.8-5.2 9.2-2.4-1.4 3.6-5.8 5-9.2 2.4z"/>
      <path d="M80.6 25c-5 1.6-6.4 6-4.4 9 3.8-.6 6-4.6 4.4-9z"/><path d="M79.4 45c-5.4.6-7.4 5-5.6 8.4 4-.2 6.6-4 5.6-8.4z"/><path d="M77.6 63c-4.6 2-5.2 6.8-2.4 9.2 3.6-1.4 5-5.8 2.4-9.2z"/>
      <circle cx="16" cy="16" r="2"/><circle cx="34" cy="12.4" r="1.1"/><circle cx="12.4" cy="34" r="1.1"/>
    </g>
  </g>

  <!-- views: what a CSS url(ornaments.svg#…) shows -->
  <view id="corner-knot" viewBox="0 0 72 72"/>
  <view id="corner-leaf" viewBox="80 0 72 72"/>
  <view id="fleuron-rule" viewBox="160 0 320 24"/>
  <view id="fleuron" viewBox="304 1 32 20"/>
  <view id="tier-diamond" viewBox="500 0 16 16"/>
  <view id="rubric-bullet" viewBox="524 0 12 12"/>
  <view id="initial-frame" viewBox="0 90 96 96"/>
</svg>
