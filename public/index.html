<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Westeros Chronicles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ======== Title / new game screen ======== -->
  <section id="title-screen" class="screen">
    <div class="title-bg"></div>
    <div class="title-inner">
      <h1 class="game-title">Westeros Chronicles</h1>
      <p class="tagline">A game of thrones, simulated by the maesters of your own machine.</p>
      <div class="title-cols">
        <div class="panel parchment" id="scenario-panel">
          <h2>New Game</h2>
          <div id="scenario-list"></div>
          <h3>Choose your house</h3>
          <input id="house-search" class="input" placeholder="Search houses…">
          <div class="house-filters" id="house-filters"></div>
          <div id="house-grid" class="house-grid"></div>
        </div>
        <div class="panel parchment" id="house-detail">
          <div class="muted">Select a house to see its lands and people.</div>
        </div>
        <div class="panel parchment" id="saves-panel">
          <h2>Continue</h2>
          <div id="save-list" class="save-list"></div>
          <hr>
          <div class="llm-status" id="llm-status-title"></div>
          <button class="btn" data-action="settings">⚙ Model Settings</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ======== Main game ======== -->
  <section id="game-screen" class="screen hidden">
    <header id="topbar">
      <div class="tb-house" id="tb-house"></div>
      <div class="tb-stats" id="tb-stats"></div>
      <div class="tb-date" id="tb-date"></div>
      <div class="tb-actions">
        <button class="icon-btn" data-action="chronicle" title="The Chronicle (long-term memory)">📜</button>
        <button class="icon-btn" data-action="ravens" title="Ravens">🐦<span id="raven-badge" class="badge hidden"></span></button>
        <button class="icon-btn" data-action="undo" title="Undo last turn">↶</button>
        <button class="icon-btn" data-action="settings" title="Settings">⚙</button>
        <button class="icon-btn" data-action="menu" title="Main menu">☰</button>
      </div>
    </header>

    <div id="main">
      <aside id="left" class="sidebar">
        <nav class="tabs" id="left-tabs">
          <button data-tab="realm" class="active">Realm</button>
          <button data-tab="court">Court</button>
          <button data-tab="forces">Forces</button>
          <button data-tab="diplomacy">Diplomacy</button>
          <button data-tab="houses">Houses</button>
          <button data-tab="people">People</button>
        </nav>
        <div class="tab-body" id="left-body"></div>
      </aside>

      <div id="map-wrap">
        <canvas id="map"></canvas>
        <div id="map-loading" class="map-loading"><div class="spinner"></div><div id="map-loading-text">Unrolling the map…</div><div class="bar"><div id="map-loading-bar"></div></div></div>
        <div id="tooltip" class="tooltip hidden"></div>
        <div id="mapmodes" class="mapmodes">
          <button data-mode="political" class="active" title="Realms">Realms</button>
          <button data-mode="houses" title="Holders">Holders</button>
          <button data-mode="diplomacy" title="Your relations">Diplomacy</button>
          <button data-mode="unrest" title="Unrest">Unrest</button>
          <button data-mode="prosperity" title="Prosperity">Prosperity</button>
          <button data-mode="terrain" title="Terrain">Terrain</button>
        </div>
        <div id="selection-card" class="selection-card hidden"></div>
      </div>

      <aside id="right" class="sidebar">
        <nav class="tabs" id="right-tabs">
          <button data-tab="feed" class="active">Events</button>
          <button data-tab="chat">Audience</button>
        </nav>
        <div class="tab-body" id="right-body"></div>
      </aside>
    </div>

    <footer id="orders-bar">
      <div class="orders-list" id="orders-list"></div>
      <div class="orders-input">
        <textarea id="order-input" rows="2" placeholder="Command your house… e.g. “Call the banners. Every lord of the North is to muster at Winterfell within the moon.”  (Enter to add · Shift+Enter for new line)"></textarea>
        <div class="orders-buttons">
          <button class="btn ghost" data-action="suggest" title="Ask your advisors for ideas">✨ Counsel</button>
          <button class="btn" data-action="add-order">Add Order</button>
        </div>
      </div>
      <div class="advance">
        <select id="span-select" class="input">
          <option value="1w">1 week</option>
          <option value="2w">2 weeks</option>
          <option value="1m" selected>1 moon</option>
          <option value="3m">3 moons</option>
          <option value="6m">6 moons</option>
          <option value="1y">1 year</option>
        </select>
        <button class="btn primary big" data-action="advance">Advance ▶</button>
      </div>
    </footer>
  </section>

  <!-- ======== Modals ======== -->
  <div id="modal" class="modal hidden"><div class="modal-box parchment" id="modal-box"></div></div>
  <div id="busy" class="busy hidden"><div class="busy-inner"><div class="raven">🐦‍⬛</div><div id="busy-text">The maesters confer…</div><div id="busy-time" class="muted"></div></div></div>
  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
