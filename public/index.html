<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Westeros Chronicles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="cloth" x="-5%" y="-2%" width="110%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.035" numOctaves="1" seed="4"><animate attributeName="baseFrequency" dur="11s" values="0.008 0.035;0.011 0.03;0.008 0.035" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <!-- ═════════ Title screen ═════════ -->
  <section id="title-screen" class="screen">
    <div class="title-bg"><canvas id="title-map"></canvas></div>
    <div class="title-inner">
      <header class="title-head">
        <h1 class="game-title">Westeros Chronicles</h1>
        <p class="tagline">A game of thrones, simulated by the maesters of your own machine.</p>
      </header>
      <div class="title-cols">
        <div class="panel" id="scenario-panel">
          <div id="scenario-list"></div>
          <div class="house-picker-head">
            <h2>Choose your house</h2>
            <input id="house-search" class="input" placeholder="Search houses…">
          </div>
          <div class="house-filters" id="house-filters"></div>
          <div id="house-grid" class="house-grid"></div>
        </div>
        <div class="panel" id="house-detail"><div class="empty-detail"><div class="big-sigil">🛡</div><p>Select a house to see its lands, its people and its prospects.</p></div></div>
        <div class="panel" id="saves-panel">
          <h2>Continue</h2>
          <div id="save-list" class="save-list"></div>
          <div class="llm-box">
            <h3>The Maester-Simulator</h3>
            <div class="llm-status" id="llm-status-title"></div>
            <button class="btn" data-action="settings">⚙ Settings &amp; model endpoint</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═════════ Game ═════════ -->
  <section id="game-screen" class="screen hidden">
    <div id="map-wrap"></div>
    <div id="map-loading" class="map-loading hidden"><img id="map-loading-banner" class="loading-banner" alt=""><div class="loading-title">Westeros Chronicles</div><div class="loading-words" id="map-loading-words"></div><div class="bar"><div id="map-loading-bar"></div></div><div id="map-loading-text" class="loading-text">Unrolling the map…</div><blockquote id="map-loading-quote" class="loading-quote"></blockquote></div>

    <!-- top bar: resources + date + time controls -->
    <header id="hud-top">
      <div class="res-row" id="res-row"></div>
      <div class="hud-top-right">
        <div class="date-box" id="date-box"></div>
        <div class="time-controls">
          <select id="span-select" title="How much time passes">
            <option value="1w">1 week</option><option value="2w">2 weeks</option><option value="1m" selected>1 moon</option>
            <option value="3m">3 moons</option><option value="6m">6 moons</option><option value="1y">1 year</option>
          </select>
          <button class="btn primary advance-btn" data-action="advance" title="Advance time (Ctrl+Enter)">Advance ▶</button>
        </div>
        <div class="sys-btns">
          <button class="icon-btn" data-action="ravens" title="Letters">🐦<span id="raven-badge" class="badge hidden"></span></button>
          <button class="icon-btn" data-action="music" title="Music on/off" id="music-btn">🎵</button>
          <button class="icon-btn" data-action="undo" title="Undo last turn">↶</button>
          <button class="icon-btn" data-action="settings" title="Settings &amp; model endpoint">⚙</button>
          <button class="icon-btn" data-action="menu" title="Main menu">☰</button>
        </div>
      </div>
    </header>

    <!-- player identity + main action ring (CK3-style) -->
    <div id="hud-player">
      <div class="player-banner" id="player-banner" data-action="open-realm"></div>
      <div class="player-card">
        <button class="player-portrait" id="player-portrait" data-action="open-ruler"></button>
        <div class="player-name" id="player-name"></div>
      </div>
      <nav class="action-ring" id="action-ring">
        <button data-win="realm" title="Realm (R)"><span>🏰</span><em>Realm</em></button>
        <button data-win="council" title="Council (C)"><span>🕯</span><em>Council</em></button>
        <button data-win="military" title="Military (M)"><span>⚔</span><em>Military</em></button>
        <button data-win="economy" title="Economy (E)"><span>🪙</span><em>Economy</em></button>
        <button data-win="diplomacy" title="Diplomacy (D)"><span>🕊</span><em>Diplomacy</em></button>
        <button data-win="intrigue" title="Intrigue (I)"><span>🗡</span><em>Intrigue</em></button>
        <button data-win="people" title="People (P)"><span>👥</span><em>People</em></button>
        <button data-win="chronicle" title="Chronicle (H)"><span>📜</span><em>Chronicle</em></button>
      </nav>
    </div>

    <!-- left sliding window -->
    <aside id="window" class="window hidden"><div class="win-head"><h2 id="win-title"></h2><button class="win-close" data-action="close-window">✕</button></div><div class="win-body" id="win-body"></div></aside>

    <!-- floating detail sheet (character / holding / army) -->
    <aside id="sheet" class="sheet hidden"><button class="win-close" data-action="close-sheet">✕</button><div id="sheet-body"></div></aside>

    <!-- right drawer: events & letters / audiences -->
    <aside id="drawer" class="drawer">
      <nav class="drawer-tabs" id="drawer-tabs">
        <button data-tab="feed" class="active">Events</button>
        <button data-tab="letters">Letters <span id="letters-count"></span></button>
        <button data-tab="audience">Audience</button>
        <button class="collapse" data-action="toggle-drawer" title="Hide">⟩</button>
      </nav>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
    <button id="drawer-open" class="drawer-open hidden" data-action="toggle-drawer">⟨ Events</button>

    <!-- command bar -->
    <footer id="command">
      <div class="orders" id="orders"></div>
      <div class="cmd-row">
        <textarea id="order-input" rows="1" placeholder="Command your house…   e.g. “Call the banners. Every lord of the North musters at Winterfell within the moon.”"></textarea>
        <button class="btn ghost" data-action="suggest" title="Ask your advisors for ideas">✨ Counsel</button>
        <button class="btn" data-action="add-order" title="Add order (Enter)">＋ Order</button>
      </div>
    </footer>

    <div id="mapmodes" class="mapmodes">
      <button data-mode="political" class="active" data-mi="crown" title="Realms map">Realms</button>
      <button data-mode="houses" data-mi="castle" title="Holders map">Holders</button>
      <button data-mode="diplomacy" data-mi="dove" title="Diplomacy map">Diplomacy</button>
      <button data-mode="economy" data-mi="coin" title="Wealth map">Wealth</button>
      <button data-mode="prosperity" data-mi="wheat" title="Prosperity map">Prosperity</button>
      <button data-mode="unrest" data-mi="fire" title="Unrest map">Unrest</button>
      <button data-mode="terrain" data-mi="map" title="Terrain map">Terrain</button>
    </div>
    <div id="pick-hint" class="pick-hint hidden"></div>
    <div id="tooltip" class="tooltip hidden"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="busy" class="busy hidden"><div class="busy-inner"><div class="raven">🐦‍⬛</div><div id="busy-text">The maesters confer…</div><div id="busy-time" class="muted"></div></div></div>
  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
