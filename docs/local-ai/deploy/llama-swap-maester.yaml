# Maester-12B — llama-swap entries for the owner's C:/llamaswap/config.yaml  (llama-swap v252 or newer)
# Nothing here has been applied to the live config. Add the entries below to the `models:` block and their ids to the members of the `gpu` group.
#
# ONE model, two behaviours. Maester-12B = Gemma 4 12B QAT (6.7 GB, wholly on the GPU) + one LoRA adapter trained on every role of the game.
# Both ids below run the SAME llama-server process (llama-swap `setParamsByID` makes aliases of one entry, it never loads a second copy):
#     maester-12b         adapter ON  (scale 1) — interpret, mind, director, audience, council, consolidate ...
#     maester-12b:plain   adapter OFF (scale 0) — byte-identical to the untuned Gemma 4 12B (verified 16/16 greedy answers); use it for `narrate`,
#                                                  where the fine-tune did not beat the untuned model (see docs/local-ai/RESULTS.md)
# Requirements verified on this PC (2026-09-30):
#   * llama-server b11242 (official win-cuda-13.4 build kept at C:/wc-ai/bin/llama-b11242): the 12B (model_type gemma4_unified), the MTP drafter and LoRA need it.
#     The owner's C:/llamacpp build (5266f24) is NOT tested with the 12B. `--no-mmap` is gone in b11242: use `--load-mode none`.
#   * keep total VRAM after load <= ~10.7 GB (with MTP + adapter: 9.7 GB) — above that ANY other GPU program halves decode speed until restart.
#   * the adapter stays UNMERGED (merging it into a 4-bit model erases its effect). It costs ~23 % decode speed; MTP more than pays it back.
#   * no sampler flags beyond these (tested: --min-p made narrate worse); never pin slots (id_slot) — the game's routing must send `slot: null`.
# Files to copy first (all under C:/models/gemma4/):
#     gemma-4-12B-it-qat-UD-Q4_K_XL.gguf        (6.7 GB, from C:/wc-ai/models/gemma4/)
#     mtp-gemma-4-12B-it.gguf                    (0.25 GB, same folder)
#     maester/maester-12b-lora.gguf              (the adapter, from C:/wc-ai/models/maester/)

  "maester-12b":
    name: "Maester-12B (fast: MTP + adapter)"
    description: "Gemma 4 12B QAT + Westeros LoRA + MTP drafter; 2 unpinned slots over one 64k pool. ~75 tok/s, 9.7 GB VRAM. Use ':plain' for the untuned behaviour."
    aliases: ["maester"]
    cmd: >
      C:/wc-ai/bin/llama-b11242/llama-server.exe --host 0.0.0.0 --port ${PORT}
      -m C:/models/gemma4/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --lora C:/models/gemma4/maester/maester-12b-lora.gguf
      -c 65536 -ngl 99 -fa on -ctk q8_0 -ctv q8_0
      -ub 1024 -b 2048 --parallel 2 --kv-unified -cram 4096 --load-mode none
      --jinja --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0
      --cont-batching --metrics -t 6 -tb 12
      --spec-type draft-mtp --spec-draft-model C:/models/gemma4/mtp-gemma-4-12B-it.gguf --spec-draft-n-max 3
    filters:
      setParamsByID:
        "${MODEL_ID}":
          lora: [{id: 0, scale: 1.0}]
        "${MODEL_ID}:plain":
          lora: [{id: 0, scale: 0.0}]
    ttl: 1800
    capabilities: { in: ["text"], out: ["text"], context: 65536 }

  "maester-12b-safe":
    name: "Maester-12B (no MTP: fallback profile)"
    description: "Same adapter without the MTP drafter: ~43 tok/s, 9.0 GB VRAM. Use if the MTP profile ever misbehaves. ':plain' = untuned behaviour."
    aliases: ["maester-safe"]
    cmd: >
      C:/wc-ai/bin/llama-b11242/llama-server.exe --host 0.0.0.0 --port ${PORT}
      -m C:/models/gemma4/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --lora C:/models/gemma4/maester/maester-12b-lora.gguf
      -c 65536 -ngl 99 -fa on -ctk q8_0 -ctv q8_0
      -ub 1024 -b 2048 --parallel 2 --kv-unified -cram 4096 --load-mode none
      --jinja --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0
      --cont-batching --metrics -t 6 -tb 12
    filters:
      setParamsByID:
        "${MODEL_ID}":
          lora: [{id: 0, scale: 1.0}]
        "${MODEL_ID}:plain":
          lora: [{id: 0, scale: 0.0}]
    ttl: 1800
    capabilities: { in: ["text"], out: ["text"], context: 65536 }

# The untuned entries from llama-swap-westeros.yaml ("westeros-gemma12", "westeros-gemma12-mtp") stay valid as a no-adapter fallback.
# group entry:  gpu:  members: [ ..., "maester-12b", "maester-12b-safe" ]
# Quick check after a reload (adapter really switches; the second answer must equal an untuned model's):
#   curl http://localhost:8033/v1/chat/completions -H "content-type: application/json" -d "{\"model\":\"maester-12b\",\"temperature\":0,\"messages\":[{\"role\":\"user\",\"content\":\"Name three houses of the North.\"}]}"
#   curl http://localhost:8033/v1/chat/completions -H "content-type: application/json" -d "{\"model\":\"maester-12b:plain\",\"temperature\":0,\"messages\":[{\"role\":\"user\",\"content\":\"Name three houses of the North.\"}]}"
